name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dev dependencies (esbuild + typescript)
        run: npm ci

      - name: Build bundle (esbuild src/content.js → src/content.bundle.js)
        run: npm run build

      - name: Syntax check (every shipped script)
        run: |
          node --check src/content.js
          node --check src/content.bundle.js
          node --check src/background.js
          node --check src/intent-hook.js
          node --check src/onboarding-state.js
          node --check src/welcome.js
          node --check src/lib/intent.js
          node --check src/lib/innertube.js
          node --check src/lib/sheet.js

      - name: Typecheck (JSDoc + tsc --checkJs)
        run: npm run typecheck

      - name: Unit tests (intent resolution + InnerTube parsers)
        run: node --test tests/intent.test.mjs tests/innertube.test.mjs

      - name: Save-sheet UI contract (skips cleanly if agent-browser absent)
        run: node tests/test-sheet-render.mjs

      - name: CWS structural validator
        run: node scripts/validate-cws.mjs

      - name: Published privacy page is in sync with PRIVACY.md
        run: node scripts/build-privacy-page.mjs --check
