name: IndexNow

# Vercel reports each deploy back to GitHub as a deployment status. When the
# Production deploy of the site succeeds, ping IndexNow (Bing and friends) with
# every URL in the sitemap. Google ignores IndexNow; it reads the sitemap.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/indexnow.mjs https://playlist.codyh.xyz
